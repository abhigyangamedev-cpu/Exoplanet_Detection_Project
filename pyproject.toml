[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exoplanet"
version = "0.1.0"
description = "Kepler exoplanet transit detection: KOI vetting with a 1D CNN and a tabular baseline."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "astropy>=6.0",
    "astroquery>=0.4.7",
    "lightkurve>=2.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "requests>=2.31",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
notebook = [
    "jupyterlab>=4.0",
    "nbclient>=0.10",
    "nbformat>=5.9",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
