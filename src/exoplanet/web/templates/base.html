<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KOI model checker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="{{ url_for('checker') }}">
      <svg viewBox="0 0 40 16" width="40" height="16" aria-hidden="true">
        <path d="M1 4H13C16 4 15 12 18 12H22C25 12 24 4 27 4H39" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>Kepler KOI model checker</span>
    </a>
    <nav aria-label="Pages">
      <a href="{{ url_for('checker') }}" {% if request.endpoint == 'checker' %}aria-current="page"{% endif %}>Checker</a>
      <a href="{{ url_for('report_home') }}" {% if request.endpoint == 'report' %}aria-current="page"{% endif %}>Report</a>
    </nav>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
