# Default pipeline configuration. Paths are relative to the repository root.

seed: 42

paths:
  data_dir: data
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  models_dir: models
  outputs_dir: outputs

catalogue:
  # NASA Exoplanet Archive TAP service, KOI cumulative table.
  tap_url: https://exoplanetarchive.ipac.caltech.edu/TAP/sync
  table: cumulative
  filename: koi_cumulative.csv  # saved under paths.raw_dir
  timeout_s: 120
  retries: 5

labels:
  positive: CONFIRMED
  negative: FALSE POSITIVE
  # CANDIDATE KOIs are unvetted: excluded from training/evaluation.
  exclude: [CANDIDATE]

sample:
  # Keep KOIs whose parameters come from these deliveries (null keeps all). Older
  # deliveries are ~98% FALSE POSITIVE and have systematically missing fields, so mixing
  # them in lets models learn provenance instead of astrophysics.
  parameter_provenance: [q1_q17_dr25_koi]

features:
  # Allowed groups: transit, stellar, centroid, multiplicity (see exoplanet.features.tabular).
  groups: [transit, stellar, centroid]

leakage:
  # Univariate audit thresholds (symmetrised AUC; 0.5 = no signal).
  max_value_auc: 0.9
  max_missing_auc: 0.6

splits:
  # Held-out test set plus cross-validation folds on the rest, all grouped by host star
  # and stratified by label. Saved once and reused by every model.
  test_fraction: 0.2
  n_folds: 5
  group_column: kepid
  filename: splits.csv  # saved under paths.processed_dir

tabular:
  # HistGradientBoostingClassifier parameters (fixed; early stopping is disabled because its
  # internal validation split would not be grouped by host star).
  params:
    learning_rate: 0.05
    max_iter: 300
    max_leaf_nodes: 15
    min_samples_leaf: 20
    l2_regularization: 1.0
  permutation_repeats: 5
  model_filename: tabular_hgb.joblib  # saved under paths.models_dir

views:
  global_bins: 2001
  local_bins: 201
  local_durations: 2.0  # half-width of the local view, in transit durations
